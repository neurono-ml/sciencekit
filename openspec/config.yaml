schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Project: sciencekit — Machine Learning library in Rust reimplementing scikit-learn.
  Product source of truth: docs/PRD.md.
  Tech stack: Rust (MSRV 1.85, edition 2024), Cargo workspace with sciencekit_* sub-crates under crates/
  (see PRD §3.1); ndarray, sprs, rayon, tokio, serde, thiserror, tracing, memmap2, sysinfo.
  Conventions: mandatory builder pattern; complete names without abbreviations
  (maximum_number_of_iterations, not max_iter), single exception being the project prefix
  sk/SK; public items mandatorily prefixed — structs/traits with SK + PascalCase
  (SKEstimator, SKStandardScaler), free functions (outside impl), variables and public
  modules with sk_ + snake_case (sk_train_test_split); methods (functions inside impl
  blocks of structs or traits) receive no prefix; zero-copy on public APIs
  (ArrayView/CowArray/sprs views); .rs files over 200 lines become standardized folder modules
  (mod.rs, builder.rs, core_implementation.rs, *_tests.rs); tests live in companion
  *_tests.rs modules beside the implementation (never inline nor a global tests/ directory).
  Workflow: no commits on main; code in worktree temporary/worktrees/<type>/<change-name>
  (branch <type>/<change-name>) and openspec definitions in temporary/worktrees/<type>/<change-name>-openspec
  (branch <type>/<change-name>-openspec); mandatory TDD via the tdd skill; final review by an independent
  agent validating spec acceptance before the PR.

rules:
  proposal:
    - Plan changes in separate groups: (1) algorithm implementation, (2) changes for the different accelerators (GPU OpenCL/CUDA/ROCm, BLAS/SIMD, allocators, Python bindings), (3) documentation changes.
    - Small changes with minimal scope; Python bindings and GPU backends are separate associated changes, created after the algorithm is ready on CPU.
    - Include acceptance criteria from PRD §8.7/§10.3: lots and little data, concurrency, model export + metrics.

  tasks:
    - Every task must be implemented using the tdd skill: test first, confirmed failure, minimal implementation, refactoring while keeping tests green.
    - Tests live in companion *_tests.rs modules beside the implementation; mock data built with ndarray/sprs.
    - Mandatory iterative evolution: naive → tests → performance (SIMD/rayon/layout) → streaming/out-of-core; no stage may be skipped.

operations:
  apply:
    guidance:
      - Implement in git worktree temporary/worktrees/<type>/<change-name> on branch <type>/<change-name> (type ∈ feat|bugfix|chore|docs). Never commit to main.
      - Commit this change's openspec/ definitions on branch <type>/<change-name>-openspec, in worktree temporary/worktrees/<type>/<change-name>-openspec.
      - Use the tdd skill for each task.
      - When all tasks are done, trigger review by an independent agent validating that the spec was effectively met before opening the PR.
  archive:
    guidance:
      - Code merges happen through PRs; when a PR is merged, the opencode agent on GitHub merges the corresponding <type>/<change-name>-openspec branch and runs change sync + archive.
