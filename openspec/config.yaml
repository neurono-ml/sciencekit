schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Projeto: sciencekit — biblioteca de Machine Learning em Rust reimplementando o scikit-learn.
  Fonte de verdade de produto: docs/PRD.md.
  Tech stack: Rust (MSRV 1.85, edition 2024), workspace Cargo com sub-crates sciencekit_* em crates/
  (ver PRD §3.1); ndarray, sprs, rayon, tokio, serde, thiserror, tracing, memmap2, sysinfo.
  Convenções: builder pattern obrigatório; nomes completos sem abreviações
  (maximum_number_of_iterations, não max_iter), única exceção o prefixo do projeto
  sk/SK; itens públicos obrigatoriamente prefixados — structs/traits com SK +
  PascalCase (SKEstimator, SKStandardScaler), funções livres (fora de impl),
  variáveis e módulos públicos com sk_ + snake_case (sk_train_test_split);
  métodos (funções dentro de impl de structs ou traits) não recebem prefixo;
  zero-copy nas APIs públicas
  (ArrayView/CowArray/views sprs); arquivo .rs >200 linhas vira módulo pasta padronizado
  (mod.rs, builder.rs, core_implementation.rs, *_tests.rs); testes em módulos companion
  *_tests.rs ao lado da implementação (nunca inline nem tests/ global).
  Workflow: nenhum commit na main; código em worktree temporary/worktrees/<type>/<change-name>
  (branch <type>/<change-name>) e definições openspec em temporary/worktrees/<type>/<change-name>-openspec
  (branch <type>/<change-name>-openspec); TDD obrigatório via skill tdd; revisão final por agente
  independente validando aceitação da spec antes do PR.

rules:
  proposal:
    - Planejar changes em grupos separados: (1) implementação do algoritmo, (2) changes para os diferentes acelerators (GPU OpenCL/CUDA/ROCm, BLAS/SIMD, alocadores, bindings Python), (3) changes para documentação.
    - Changes pequenas com escopo mínimo; binding Python e backend GPU são changes associadas separadas, criadas após o algoritmo estar pronto em CPU.
    - Incluir critérios de aceite do PRD §8.7/§10.3: muitos e poucos dados, concorrência, exportação de modelo + métricas.

  tasks:
    - Toda task deve ser implementada usando a skill tdd: teste primeiro, falha confirmada, implementação mínima, refatoração mantendo testes verdes.
    - Testes vivem em módulos companion *_tests.rs ao lado da implementação; dados mock em ndarray/sprs.
    - Evolução iterativa obrigatória: naive → testes → performance (SIMD/rayon/layout) → streaming/out-of-core; nenhuma etapa pode ser pulada.

operations:
  apply:
    guidance:
      - Implementar em git worktree temporary/worktrees/<type>/<change-name> na branch <type>/<change-name> (type ∈ feat|bugfix|chore|docs). Nunca commitar na main.
      - Commitar as definições openspec/ desta change na branch <type>/<change-name>-openspec, em worktree temporary/worktrees/<type>/<change-name>-openspec.
      - Usar a skill tdd para cada task.
      - Ao concluir todas as tasks, acionar revisão por um agente independente que valide se a spec foi efetivamente atendida antes de abrir o PR.
  archive:
    guidance:
      - O merge do código acontece via PR; quando o PR for mergeado, o agente opencode no GitHub mergeia a branch <type>/<change-name>-openspec correspondente e executa sync + archive da change.
