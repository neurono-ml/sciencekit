version: 1
generated_for: sciencekit
source_of_truth: openspec/changes/implementation-dag/dag.yaml
policy:
  max_parallel_changes_per_lane: 1
  merge_requires:
  - all tasks checked
  - openspec validate green
  - code gates green
  - independent review passed
  - code PR merged into main
  - openspec PR merged into main
  - docs PR merged into docs/documentations when the change ships docs
  global_gates:
  - cargo fmt --all --check
  - cargo clippy --workspace --all-targets -- -D warnings
  - cargo test --workspace
  docs_gate: mdbook build docs
  rebase_before_merge: true
  no_direct_main_commits: true
lanes:
