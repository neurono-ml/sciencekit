version: 1
generated_for: sciencekit
source_of_truth: openspec/changes/implementation-dag/dag.yaml
policy:
  max_parallel_changes_per_lane: 1
  target: every parity-program change shipped with the global gates green
  scheduling:
    downstream_changes_mutable: true
    downstream_mutation_rule: >-
      Implementing an earlier wave may amend a later change's proposal, design, tasks or
      dependencies when the implementation evidence demands it, provided every immutable
      clause still holds. The amendment is recorded in the later change and the ADR.
  documentation_policy:
    book_chapters_deferred: true
    deferral_reason: >-
      The Development Explained book changes format after the program; chapters are not
      written per change during execution.
    replaced_by: >-
      One ADR per shipped change (a new Architecture Decision Record issue or an amendment
      of an existing one), linked from the change PR with a closing keyword. The book is
      rebuilt from the ADRs afterwards.
    retained: [README, CHANGELOG, coverage page, API docs]
  acceptance_policy:
    - end-to-end tests with and without lazy/out-of-core inputs
    - memory and resource guard tests (batch guard, mapped budget, concurrency)
    - model export and reload round-trip where the family is exportable
    - large and small data fixtures
  tracing_policy:
    - nested spans: pipeline > stage > operation > step > epoch > batch
    - every inference (predict, transform, score) emits its own trace
    - fit and predict share one span vocabulary
    - batch spans at TRACE with a per-epoch cap and an aggregated summary event
    - errors mark the whole ancestor chain with status ERROR
    - the trace context crosses the FFI via a W3C traceparent
  immutable_clauses:
    - full scikit-learn 1.9.1 parity per parity.yaml, with the access-pattern doctrine
    - builder pattern with backend and execution_mode on every estimator
    - no abbreviations in public names; SK prefix rules
    - zero-copy on public APIs; representation parity; sparse never densified
    - TDD with companion *_tests.rs modules; one commit per task
    - worktree workflow: no direct commits on main; code and openspec PRs per change
    - an ADR issue per change, referenced by both PRs with closing keywords
    - CHANGELOG updated on every merged change
    - the tracing policy above
  parity_matrix: openspec/changes/sklearn-parity-matrix/parity.yaml
  one_algorithm_per_change: true
  merge_requires:
  - all tasks checked
  - openspec validate green
  - code gates green
  - independent review passed
  - code PR merged into main
  - openspec PR merged into main
  - docs PR merged into docs/documentations when the change ships docs
  global_gates:
  - cargo fmt --all --check
  - cargo clippy --workspace --all-targets -- -D warnings
  - cargo test --workspace
  docs_gate: mdbook build docs
  rebase_before_merge: true
  no_direct_main_commits: true

