[package]
name = "sciencekit_lua"
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
description = "Lua 5.4 bindings for the sciencekit machine-learning library."
repository = "https://github.com/neurono-ml/sciencekit"

[lib]
name = "sciencekit_lua"
# `cdylib` is the loadable Lua module; `rlib` lets the crate's own tests link
# the same code without a second target.
crate-type = ["cdylib", "rlib"]

[dependencies]
sciencekit_ffi = { path = "../sciencekit_ffi", version = "0.1.0" }
# Lua 5.4 is compiled from source into the module (`vendored`), so neither a
# system `liblua` nor pkg-config is required. `mlua`'s `module` feature is
# deliberately not used: it refuses to coexist with `vendored`, and the entry
# point is written by hand on `Lua::entrypoint1` instead (see `lib.rs`).
mlua = { version = "0.10", features = ["lua54", "vendored"] }
