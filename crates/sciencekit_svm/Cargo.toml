[package]
name = "sciencekit_svm"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
description = "Support-vector classifiers and regressors for sciencekit: pure-Rust SMO solver, Mercer kernels, OvO multiclass and Platt/coupled probability calibration."
repository = "https://github.com/neurono-ml/sciencekit"

[dependencies]
sciencekit_common = { path = "../sciencekit_common", version = "0.8.1" }
sciencekit_math = { path = "../sciencekit_math", version = "0.8.1" }
ndarray = { workspace = true }
rayon = { workspace = true }
sprs = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
sciencekit_metrics = { path = "../sciencekit_metrics", version = "0.8.1" }
tracing-subscriber = { workspace = true }
