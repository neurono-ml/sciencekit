[package]
name = "sciencekit_onnx"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
description = "ONNX export for sciencekit: translate a fitted model's neutral state into a valid ONNX graph."
repository = "https://github.com/neurono-ml/sciencekit"

[dependencies]
sciencekit_common = { path = "../sciencekit_common", version = "0.8.0" }
prost = "0.14"

[dev-dependencies]
ndarray = { workspace = true }
sciencekit_cluster = { path = "../sciencekit_cluster", version = "0.8.0" }
sciencekit_decomposition = { path = "../sciencekit_decomposition", version = "0.8.0" }
sciencekit_ensemble = { path = "../sciencekit_ensemble", version = "0.8.0" }
sciencekit_impute = { path = "../sciencekit_impute", version = "0.8.0" }
sciencekit_linear_model = { path = "../sciencekit_linear_model", version = "0.8.0" }
sciencekit_neighbors = { path = "../sciencekit_neighbors", version = "0.8.0" }
sciencekit_outlier = { path = "../sciencekit_outlier", version = "0.8.0" }
sciencekit_pipeline = { path = "../sciencekit_pipeline", version = "0.8.0" }
sciencekit_preprocessing = { path = "../sciencekit_preprocessing", version = "0.8.0" }
sciencekit_svm = { path = "../sciencekit_svm", version = "0.8.0" }
sciencekit_tree = { path = "../sciencekit_tree", version = "0.8.0" }
serde_json = "1"
tempfile = "3"
