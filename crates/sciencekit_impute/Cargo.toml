[package]
name = "sciencekit_impute"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
description = "Missing-data imputers for sciencekit (simple strategies, indicator, k-NN)."
repository = "https://github.com/neurono-ml/sciencekit"

[dependencies]
sciencekit_common = { path = "../sciencekit_common", version = "0.1.0" }
sciencekit_math = { path = "../sciencekit_math", version = "0.1.0" }

ndarray = { workspace = true }
rayon = { workspace = true }
sprs = { workspace = true }
tdigest = { workspace = true }

[dev-dependencies]
sciencekit_metrics = { path = "../sciencekit_metrics" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
