[package]
name = "sciencekit_ffi"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
description = "Stable C ABI for the sciencekit machine-learning library."
repository = "https://github.com/neurono-ml/sciencekit"

[lib]
name = "sciencekit_ffi"
# `rlib` exposes the same entry points to in-process bindings (the Lua module
# in `neurono-ml/sciencekit-lua` calls them directly instead of re-declaring
# the C ABI).
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
sciencekit_common = { path = "../sciencekit_common", version = "0.8.0" }
sciencekit_linear_model = { path = "../sciencekit_linear_model", version = "0.8.0" }
sciencekit_math = { path = "../sciencekit_math", version = "0.8.0" }
sciencekit_metrics = { path = "../sciencekit_metrics", version = "0.8.0" }
sciencekit_preprocessing = { path = "../sciencekit_preprocessing", version = "0.8.0" }

ndarray = { workspace = true }

[features]
# Exposes the deliberately panicking test hook in the cdylib; tests use it via
# `cfg(test)` instead.
test-hook = []
