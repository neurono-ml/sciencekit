[package]
name = "sciencekit_neighbors"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
description = "Exact spatial indexes and nearest-neighbor search for sciencekit: KD-tree and ball tree with a shared searcher contract."
repository = "https://github.com/neurono-ml/sciencekit"

[dependencies]
sciencekit_common = { path = "../sciencekit_common", version = "0.8.1" }
sciencekit_math = { path = "../sciencekit_math", version = "0.8.1" }
ndarray = { workspace = true }
rayon = { workspace = true }
sprs = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
sciencekit_metrics = { path = "../sciencekit_metrics", version = "0.8.1" }
