[package]
name = "sciencekit_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Command-line workflows for sciencekit: fit, predict, transform, evaluate, export, inspect and run reproducible workflow files."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"

[[bin]]
name = "sciencekit"
path = "src/main.rs"

[dependencies]
sciencekit = { path = "../..", version = "0.8.0" }
clap = { version = "4.6", features = ["derive"] }
ndarray = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
serde_yaml_ng = { version = "0.10", optional = true }
tracing = { workspace = true }
arrow-array = { version = "=58.3.0", optional = true }
arrow-schema = { version = "=58.3.0", optional = true }
parquet = { version = "=58.3.0", features = ["arrow"], default-features = false, optional = true }

[features]
default = ["csv"]
# CSV input and prediction output through the interop Arrow adapter.
csv = ["sciencekit/parquet"]
# Parquet input and prediction output. The interoperable reader lives behind the
# umbrella `parquet` feature; the writer uses the Arrow/Parquet crates directly.
parquet = ["dep:arrow-array", "dep:arrow-schema", "dep:parquet", "sciencekit/parquet"]
# ONNX model export through `sciencekit_onnx`.
onnx = ["sciencekit/onnx"]
# YAML workflow files through `serde_yaml_ng`.
yaml = ["dep:serde_yaml_ng"]
# OpenTelemetry export through `sciencekit_telemetry`.
telemetry = ["sciencekit/telemetry"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
opentelemetry_sdk = { workspace = true, features = ["trace", "metrics", "logs", "testing"] }

[package.metadata.docs.rs]
all-features = false
