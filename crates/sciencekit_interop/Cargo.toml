[package]
name = "sciencekit_interop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
description = "Engine-neutral interoperability layer for sciencekit: tabular schemas, typed column batches, missing-value policy, source providers and the async-to-sync bridge."
repository = "https://github.com/neurono-ml/sciencekit"

[dependencies]
sciencekit_common = { path = "../sciencekit_common", version = "0.1.0" }

ndarray = { workspace = true }
sprs = { workspace = true }
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
safetensors = "0.8"
flate2 = { version = "1.1", optional = true }
brotli = { version = "9", optional = true }
snap = { version = "1.1", optional = true }
tracing = { workspace = true }
tokio = { version = "=1.53.1", features = ["rt"] }

# Optional memory-mapped sources (feature `memmap`). `memmap2` supplies the
# read-only mapping and `npyz` parses the NumPy `.npy` header.
memmap2 = { version = "0.9", optional = true }
npyz = { version = "0.8", default-features = false, optional = true }

# Optional Arrow adapter (feature `arrow`). Versions are pinned to the last
# release whose MSRV is Rust 1.85, the workspace toolchain (PRD §3.6).
arrow-array = { version = "=58.3.0", features = ["ffi"], optional = true }
arrow-buffer = { version = "=58.3.0", optional = true }
arrow-cast = { version = "=58.3.0", optional = true }
arrow-csv = { version = "=58.3.0", optional = true }
arrow-ipc = { version = "=58.3.0", optional = true }
arrow-json = { version = "=58.3.0", optional = true }
arrow-schema = { version = "=58.3.0", features = ["ffi"], optional = true }
arrow-select = { version = "=58.3.0", optional = true }
parquet = { version = "=58.3.0", features = ["arrow"], default-features = false, optional = true }

# Optional DataFrame adapters (features `polars` and `datafusion`). Polars
# 0.46 is the last release verified on the Rust 1.85 toolchain; DataFusion 46
# declares MSRV 1.82 and pins Arrow 54.2, so it is used only inside its own
# adapter and never on the default build path.
polars = { version = "=0.46.0", default-features = false, features = ["lazy", "strings", "dtype-categorical"], optional = true }
# `polars-utils` depends on `stacker`, whose `psm` build dependency resolves to
# `ar_archive_writer` 0.5.x using let-chains (Rust 1.88) when left to float.
# Pinning `psm` through a direct optional dependency keeps `--features polars`
# buildable on the Rust 1.85 toolchain without a committed lockfile.
psm = { version = "=0.1.28", optional = true }
datafusion = { version = "=46.0.0", default-features = false, features = ["parquet"], optional = true }
# `arrow-cast` 54 (through DataFusion 46) accepts comfy-table 7.x and floats to
# 7.2, whose source uses let-chains from Rust 1.88. Pin the last 1.64-compatible
# release, the same way `psm` is pinned for Polars.
comfy-table = { version = "=7.1.4", optional = true }
futures = { version = "0.3", optional = true }


[dev-dependencies]
tracing-subscriber = { workspace = true }
tempfile = "3"

[features]
default = []
# Optional engine adapters land in their own changes; the flags exist here so
# the feature matrix can already build the neutral core alone or with each
# adapter enabled.
arrow = [
    "dep:arrow-array",
    "dep:arrow-buffer",
    "dep:arrow-cast",
    "dep:arrow-csv",
    "dep:arrow-ipc",
    "dep:arrow-json",
    "dep:arrow-schema",
    "dep:arrow-select",
    "dep:parquet",
]
# The Parquet file path is part of the Arrow adapter (`arrow`), which owns the
# `parquet` 58 dependency. The alias exists because the proposal and the task
# book document `--features parquet` as a selectable capability; it enables the
# Arrow/Parquet reader rather than a second, duplicate dependency.
parquet = ["arrow"]
polars = ["dep:polars", "dep:psm"]
datafusion = ["dep:datafusion", "dep:comfy-table", "dep:futures"]
# Memory-mapped raw binary, NumPy `.npy` and Arrow IPC sources. Arrow IPC uses
# the `arrow` adapter, so the flag enables it as well.
memmap = ["dep:memmap2", "dep:npyz", "arrow"]
compression-gzip = ["dep:flate2"]
compression-brotli = ["dep:brotli"]
compression-snappy = ["dep:snap"]
