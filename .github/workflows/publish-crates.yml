name: Publish to crates.io

# Publishes every `sciencekit*` crate on a version tag, in dependency order.
# A version already on crates.io is skipped, so re-running a failed release is
# safe (crates.io indexes asynchronously and publish can fail midway).
#
# The workflow is also dispatchable for a manual re-run of a tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish crates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.85 toolchain
        uses: dtolnay/rust-toolchain@1.85
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Pin psm to the last release that builds on the MSRV
        run: cargo update -p psm --precise 0.1.24
      - name: Publish missing crate versions
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crates.sh
