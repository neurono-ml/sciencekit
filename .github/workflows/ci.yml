name: CI

# `psm` — reached through `faer` → `npyz` → `py_literal` → `pest` → `stacker` —
# publishes builds whose `ar_archive_writer` dependency uses let-chains that need
# a newer rustc than the pinned MSRV (1.85), so a fresh resolution breaks every
# build job. The lockfile is not committed; each build job re-pins the last
# `psm` release that compiles on 1.85. Drop the pin when `psm` stops needing a
# newer rustc or when the MSRV is raised.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    name: Formatting (cargo fmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.85 toolchain (rustfmt)
        uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

  clippy:
    name: Static analysis (clippy, warnings as errors)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.85 toolchain (clippy)
        uses: dtolnay/rust-toolchain@1.85
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Pin psm to the last release that builds on the MSRV
        run: cargo update -p psm --precise 0.1.24
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Workspace tests + doctests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.85 toolchain
        uses: dtolnay/rust-toolchain@1.85
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Pin psm to the last release that builds on the MSRV
        run: cargo update -p psm --precise 0.1.24
      - name: cargo test --workspace --all-targets
        run: cargo test --workspace --all-targets

  interop:
    name: Interop crate feature matrix (core first)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.85 toolchain
        uses: dtolnay/rust-toolchain@1.85
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Pin psm to the last release that builds on the MSRV
        run: cargo update -p psm --precise 0.1.24
      - name: Core build + tests (no engine feature)
        run: cargo test -p sciencekit_interop
      - name: Arrow adapter tests
        run: cargo test -p sciencekit_interop --features arrow
      - name: Safetensors compression codec tests
        run: |
          for feature in compression-gzip compression-brotli compression-snappy; do
            cargo test -p sciencekit_interop --features "$feature"
          done
          cargo test -p sciencekit_interop --features "compression-gzip,compression-brotli,compression-snappy"
      - name: Each optional engine feature builds
        run: |
          for feature in arrow polars datafusion memmap; do
            cargo build -p sciencekit_interop --features "$feature"
          done

  examples:
    name: Examples (build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.85 toolchain
        uses: dtolnay/rust-toolchain@1.85
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Pin psm to the last release that builds on the MSRV
        run: cargo update -p psm --precise 0.1.24
      - name: cargo build --examples
        run: cargo build --examples
      - name: cargo test --examples
        run: cargo test --examples

  msrv:
    name: MSRV gate (exact 1.85)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install exact Rust 1.85 toolchain (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Pin psm to the last release that builds on the MSRV
        run: cargo update -p psm --precise 0.1.24
      - name: cargo build + test on exact 1.85
        run: |
          cargo build --workspace --all-targets
          cargo test --workspace --all-targets