name: Go bindings

on:
  push:
    branches: [main]
    paths:
      - "go/**"
      - "go.work"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "scripts/build-go-library.sh"
      - "crates/sciencekit_ffi/**"
      - ".github/workflows/go-bindings.yml"
  pull_request:
    paths:
      - "go/**"
      - "go.work"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "scripts/build-go-library.sh"
      - "crates/sciencekit_ffi/**"
      - ".github/workflows/go-bindings.yml"

jobs:
  test:
    name: Build the native library and run go test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.85 toolchain
        uses: dtolnay/rust-toolchain@1.85
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: go/go.mod
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Pin psm to the last release that builds on the MSRV
        run: cargo update -p psm --precise 0.1.24
      - name: Build the sciencekit shared library
        run: cargo build -p sciencekit_ffi --release
      - name: gofmt
        run: test -z "$(gofmt -l go)"
      - name: go vet
        env:
          CGO_CFLAGS: -I${{ github.workspace }}/crates/sciencekit_ffi/include
          CGO_LDFLAGS: -L${{ github.workspace }}/target/release -lsciencekit_ffi
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: go vet ./go/...
      - name: go test
        env:
          CGO_CFLAGS: -I${{ github.workspace }}/crates/sciencekit_ffi/include
          CGO_LDFLAGS: -L${{ github.workspace }}/target/release -lsciencekit_ffi
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: go test -race ./go/...
      - name: go test with strict cgo pointer checks
        env:
          GOEXPERIMENT: cgocheck2
          CGO_CFLAGS: -I${{ github.workspace }}/crates/sciencekit_ffi/include
          CGO_LDFLAGS: -L${{ github.workspace }}/target/release -lsciencekit_ffi
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: go test ./go/...
