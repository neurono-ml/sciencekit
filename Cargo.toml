# sciencekit — Cargo workspace root
#
# The root is the `sciencekit` umbrella crate and the workspace root. Future
# `sciencekit_*` sub-crates live under `crates/` and are added to `members` one
# per change (PRD §3.1) to keep PRs small. The umbrella re-exports them (Phase 7).
#
# MSRV: Rust 1.85 (PRD §3.6), pinned by rust-toolchain.toml.

[package]
name = "sciencekit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Machine learning in Rust, reimplementing scikit-learn: one umbrella crate over the sciencekit_* family, with extreme performance, zero-copy and native out-of-core."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["machine-learning", "scikit-learn", "statistics", "ndarray", "data-science"]
categories = ["science", "algorithms"]
# docs.rs builds the whole integration surface so every feature-gated adapter
# has a rendered page; the crate itself stays core-only by default. `all-features`
# is not usable here: `allocator-jemalloc` and `allocator-mimalloc` are mutually
# exclusive in `sciencekit_common` and enabling both is a deliberate compile
# error, so the integration features are listed explicitly.
[package.metadata.docs.rs]
features = [
    "opencl",
    "telemetry",
    "otlp-grpc",
    "otlp-http",
    "observability-export",
    "onnx",
    "polars",
    "datafusion",
    "memmap",
    "parquet",
    "compression-gzip",
    "compression-brotli",
    "compression-snappy",
]
rustdoc-args = ["--cfg", "docsrs"]

# The language bindings live in their own repositories
# (`neurono-ml/sciencekit-go` and `neurono-ml/sciencekit-lua`); only the Rust
# core and the shared C ABI (`sciencekit_ffi`) stay here.
exclude = [".devcontainer/"]

[workspace]
resolver = "3"
members = [
    "crates/sciencekit_cluster",
    "crates/sciencekit_common",
    "crates/sciencekit_decomposition",
    "crates/sciencekit_ensemble",
    "crates/sciencekit_ffi",
    "crates/sciencekit_gpu",
    "crates/sciencekit_gpu_opencl",
    "crates/sciencekit_impute",
    "crates/sciencekit_interop",
    "crates/sciencekit_linear_model",
    "crates/sciencekit_math",
    "crates/sciencekit_metrics",
    "crates/sciencekit_model_selection",
    "crates/sciencekit_neighbors",
    "crates/sciencekit_onnx",
    "crates/sciencekit_outlier",
    "crates/sciencekit_pipeline",
    "crates/sciencekit_svm",
    "crates/sciencekit_telemetry",
    "crates/sciencekit_tree",
    "crates/sciencekit_preprocessing",
    "crates/sciencekit_cli",
]

# Single source of truth for the workspace version and shared package metadata.
# Every crate inherits `version` (and the umbrella crate inherits the rest), so a
# release bumps one line and internal dependencies always resolve to it.
[workspace.package]
version = "0.8.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/neurono-ml/sciencekit"
homepage = "https://neurono-ml.github.io/sciencekit/"
documentation = "https://docs.rs/sciencekit"

# Optimize dependencies in dev/test builds. The pure-Rust linear algebra
# (`faer`) is dramatically slower unoptimized — an SVD that takes milliseconds
# optimized takes tens of seconds in a fully debug build — which would make the
# large-data algorithm tests (PRD §8.7) impractical. Our own crates stay
# unoptimized for fast iteration.
[profile.dev.package."*"]
opt-level = 2

# Shared dependency pins for the workspace sub-crates (Phase 0.4 adds the
# execution-decision, observability and allocator-selection dependencies).
[workspace.dependencies]
tracing = "0.1"
tracing-opentelemetry = { version = "0.33", default-features = false }
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false }
opentelemetry-appender-tracing = "0.32"
tracing-subscriber = "0.3"
tikv-jemallocator = "0.5"
mimalloc = "0.1"

ndarray = { version = "0.17", features = ["rayon"] }

# Data-parallel compute pool (PRD §5); the sparse output build uses it.
rayon = "1"

# Sparse CSR representation (PRD §3); the sparse output path of the
# preprocessing encoders and the sparse imputation path build on it.
sprs = "0.11"

# Compact bit membership masks for histogram-boosting categorical splits
# (spec `histogram-gradient-boosting`).
bitvec = "1.1"

# Online quantile sketch for the robust scaler (spec `robust-scaler`) and for the
# streaming median of the imputer (spec `simple-imputer`).
tdigest = "1.0"

# Directed acyclic graph structure for runtime feature pipelines (spec
# `pipeline-graph`).
petgraph = "0.7"
# The umbrella owns no logic: it depends on every sub-crate and re-exports the
# stable public surface. The sub-crates stay independently consumable, so a user
# that wants one algorithm family can depend on it alone.
[dependencies]
sciencekit_common = { path = "crates/sciencekit_common", version = "0.8.1" }
sciencekit_math = { path = "crates/sciencekit_math", version = "0.8.1" }
sciencekit_metrics = { path = "crates/sciencekit_metrics", version = "0.8.1" }
sciencekit_preprocessing = { path = "crates/sciencekit_preprocessing", version = "0.8.1" }
sciencekit_impute = { path = "crates/sciencekit_impute", version = "0.8.1" }
sciencekit_linear_model = { path = "crates/sciencekit_linear_model", version = "0.8.1" }
sciencekit_neighbors = { path = "crates/sciencekit_neighbors", version = "0.8.1" }
sciencekit_cluster = { path = "crates/sciencekit_cluster", version = "0.8.1" }
sciencekit_tree = { path = "crates/sciencekit_tree", version = "0.8.1" }
sciencekit_ensemble = { path = "crates/sciencekit_ensemble", version = "0.8.1" }
sciencekit_decomposition = { path = "crates/sciencekit_decomposition", version = "0.8.1" }
sciencekit_model_selection = { path = "crates/sciencekit_model_selection", version = "0.8.1" }
sciencekit_pipeline = { path = "crates/sciencekit_pipeline", version = "0.8.1" }
sciencekit_interop = { path = "crates/sciencekit_interop", version = "0.8.1" }
sciencekit_svm = { path = "crates/sciencekit_svm", version = "0.8.1" }
sciencekit_outlier = { path = "crates/sciencekit_outlier", version = "0.8.1" }
sciencekit_gpu = { path = "crates/sciencekit_gpu", version = "0.8.1" }
sciencekit_gpu_opencl = { path = "crates/sciencekit_gpu_opencl", version = "0.8.1", optional = true }
sciencekit_telemetry = { path = "crates/sciencekit_telemetry", version = "0.8.1", optional = true }
sciencekit_onnx = { path = "crates/sciencekit_onnx", version = "0.8.1", optional = true }
sciencekit_ffi = { path = "crates/sciencekit_ffi", version = "0.8.1" }

# The default build is core-only: no GPU runtime, no OpenTelemetry SDK, no ONNX
# translator and no engine adapter. Each optional integration forwards to the
# sub-crate that owns it, so the umbrella never re-declares a dependency
# version. Python bindings are a separate crate (`sciencekit_python`) and are
# deliberately not a feature here.
[features]
default = []
# OpenCL device backend: enables the backend in `sciencekit_gpu` and pulls in
# the vendor-facing `sciencekit_gpu_opencl` package.
opencl = [
    "dep:sciencekit_gpu_opencl",
    "sciencekit_gpu_opencl/gpu-opencl",
    "sciencekit_gpu/opencl",
]
# OpenTelemetry trace, log and metric export pipelines, with both OTLP
# transports enabled (the sub-crate's own `telemetry` umbrella feature).
telemetry = ["dep:sciencekit_telemetry", "sciencekit_telemetry/telemetry"]
# Granular OTLP transports for a build that wants only one exporter stack.
otlp-grpc = ["dep:sciencekit_telemetry", "sciencekit_telemetry/otlp-grpc"]
otlp-http = ["dep:sciencekit_telemetry", "sciencekit_telemetry/otlp-http"]
# ONNX graph translation (export and import).
onnx = ["dep:sciencekit_onnx"]
# Polars DataFrame adapter for `sciencekit_interop`.
polars = ["sciencekit_interop/polars"]
# DataFusion adapter for `sciencekit_interop`.
datafusion = ["sciencekit_interop/datafusion"]
# Memory-mapped raw binary, NumPy `.npy` and Arrow IPC sources.
memmap = ["sciencekit_interop/memmap"]
# Safetensors payload compression codecs.
compression-gzip = ["sciencekit_interop/compression-gzip"]
compression-brotli = ["sciencekit_interop/compression-brotli"]
compression-snappy = ["sciencekit_interop/compression-snappy"]
# Global allocator selection (mutually exclusive, as in `sciencekit_common`).
allocator-jemalloc = ["sciencekit_common/allocator-jemalloc"]
allocator-mimalloc = ["sciencekit_common/allocator-mimalloc"]
# Minimal trace-only OpenTelemetry layer from `sciencekit_common`.
observability-export = ["sciencekit_common/observability-export"]
# Arrow/Parquet file paths (the sub-crate aliases it to its Arrow adapter).
parquet = ["sciencekit_interop/parquet"]

# The umbrella's own compile tests build small in-memory designs.
[dev-dependencies]
ndarray = { workspace = true }
sprs = { workspace = true }
tracing-subscriber = { workspace = true }
